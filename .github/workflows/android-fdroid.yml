# Die Android-APK so bauen, wie F-Droid sie baut — damit F-Droid sie bitgleich
# nachbauen und die Entwickler-Signatur uebernehmen kann (Reproducible Builds).
#
# WARUM HIER UND NICHT AUF DEM WINDOWS-RECHNER (gemessen am 14.10.2026, siehe
# secure-messenger/fdroid/README.md): der Flutter-Bau schreibt absolute Pfade
# in libapp.so und libwebcrypto.so, und das JDK beeinflusst classes.dex. Zwei
# Bauten im selben Pfad mit demselben JDK sind bitgleich, alles andere nicht.
# F-Droid baut in /home/vagrant/build/com.bitdm.bitdm im Image
# buildserver-trixie mit OpenJDK 21. Also wird genau dort gebaut, mit genau
# `fdroid build` — auch der Scanner laeuft mit, denn er loescht vor dem Bau
# Binaerdateien (scandelete), und das muss hier genauso geschehen.
#
# HERAUS KOMMT EINE UNSIGNIERTE APK. Signiert wird beim Entwickler, der
# Schluessel kommt nie auf GitHub. Danach: signierte APK an den Release als
# bitdm-<fassung>.apk — F-Droid holt sie ueber `Binaries:` und vergleicht.
#
# ZWEI AUFTRAEGE wie in linux.yml: `bauen` laeuft fremden Code (Gradle, pub,
# Bau-Hooks) und darf deshalb nur lesen; `beglaubigen` bestaetigt per Sigstore,
# dass die APK aus diesem Lauf stammt (`gh attestation verify`).
#
# SIGNALS LIBSIGNAL KOMMT AUS DER QUELLE (ab 2.0.0). Der Build-Hook des
# Dart-Pakets `libsignal` wuerde vorgebaute Bibliotheken von GitHub laden und
# sie nur gegen eine Pruefsummendatei aus demselben Release pruefen. Das Rezept
# baut sie stattdessen mit fest gepinnter Rust-Toolchain, cargo-ndk und protoc
# (secure-messenger/fdroid/libsignal-quellbau.sh) und stellt den Hook so um,
# dass er nur diesen Bau nimmt. Weil das im Rezept steht, macht F-Droids
# eigener Bauserver genau dasselbe. Der Schritt „libsignal aus der Quelle“
# prueft danach an der fertigen APK, dass es wirklich diese Bibliotheken sind.
#
# GEGENPROBE: Von Hand mit `gegenprobe` gestartet, baut der Workflow dieselbe
# Quelle zweimal auf getrennten Runnern, und `vergleichen` verlangt zwei
# bitgleiche APKs. So wird die Reproduzierbarkeit gemessen, bevor F-Droid sie
# misst. Beglaubigt wird nur der erste Bau.
name: Android (F-Droid-Bau)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gegenprobe:
        description: 'Zweimal getrennt bauen und auf Bitgleichheit vergleichen'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lauf: ${{ fromJSON(inputs.gegenprobe && '["erster", "zweiter"]' || '["erster"]') }}
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
      HOME_VAGRANT: /home/vagrant
      # fdroidserver fest auf einen Commit von master. F-Droids eigene Pipeline
      # nimmt den jeweils neuesten Stand von master, und der unterscheidet sich
      # vom Release 2.4.5 deutlich in build.py, scanner.py und common.py — der
      # Scanner entscheidet mit, was vor dem Bau geloescht wird. Ein fester
      # Commit haelt den Lauf nachvollziehbar; weicht F-Droid einmal ab, hier
      # anheben (`git ls-remote https://gitlab.com/fdroid/fdroidserver.git master`).
      FDROIDSERVER_COMMIT: '5806784d0d43bed7b938fd4b327162da68927060'
    outputs:
      apk: ${{ steps.raus.outputs.apk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: quelle

      - name: Rezept fuer genau diesen Stand
        id: rezept
        run: |
          set -eu
          P=quelle/secure-messenger/app/pubspec.yaml
          VERSION=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' "$P")
          CODE=$(sed -n 's/^version: *[^+]*+\([0-9]*\).*/\1/p' "$P")
          test -n "$VERSION" && test -n "$CODE"
          # DIE APP MUSS IHRE EIGENE FASSUNG KENNEN. lib/fassung.dart traegt sie
          # fuer den Update-Hinweis; stand sie hinter der pubspec, hielt sich
          # 1.9.1 fuer 1.9.0 und haette sich selbst als veraltet gemeldet
          # (Tag v1.9.1 vom 15.10.2026, vor der Veroeffentlichung bemerkt).
          FASSUNG=$(sed -n "s/^const String appFassung = '\([^']*\)';.*/\1/p" \
            quelle/secure-messenger/app/lib/fassung.dart)
          if [ "$FASSUNG" != "$VERSION" ]; then
            echo "::error::lib/fassung.dart sagt '$FASSUNG', pubspec.yaml sagt '$VERSION'"
            exit 1
          fi
          mkdir -p "$HOME_VAGRANT/metadata"
          # Fassung, Code und Commit eintragen; `Binaries` und
          # `AllowedAPKSigningKeys` heraus — die signierte APK gibt es ja erst
          # NACH diesem Lauf.
          #
          # Das Rezept als PFAD und nicht ueber stdin: stdin gehoert hier dem
          # Programm selbst (Heredoc). Bis zum 15.10.2026 stand beides da, die
          # Shell nahm nur die letzte Umleitung, und heraus kam eine LEERE
          # Metadatendatei ("No such versionCode").
          python3 - "$VERSION" "$CODE" "$GITHUB_SHA" \
            quelle/secure-messenger/fdroid/com.bitdm.bitdm.yml \
            > "$HOME_VAGRANT/metadata/com.bitdm.bitdm.yml" <<'PY'
          import re, sys
          version, code, commit, rezept = sys.argv[1:5]
          s = open(rezept, encoding="utf-8").read()
          s = re.sub(r"(?m)^(Binaries|AllowedAPKSigningKeys):.*\n", "", s)
          s = re.sub(r"(?m)^(  - versionName: ).*$", r"\g<1>" + version, s, count=1)
          s = re.sub(r"(?m)^(    versionCode: ).*$", r"\g<1>" + code, s, count=1)
          s = re.sub(r"(?m)^(    commit: ).*$", r"\g<1>" + commit, s, count=1)
          s = re.sub(r"(?m)^(CurrentVersion: ).*$", r"\g<1>" + version, s)
          s = re.sub(r"(?m)^(CurrentVersionCode: ).*$", r"\g<1>" + code, s)
          sys.stdout.write(s)
          PY
          cat "$HOME_VAGRANT/metadata/com.bitdm.bitdm.yml"
          # Nicht still mit einer kaputten Datei weiterlaufen.
          grep -q "^    versionCode: $CODE\$" "$HOME_VAGRANT/metadata/com.bitdm.bitdm.yml"
          grep -q "^    commit: $GITHUB_SHA\$" "$HOME_VAGRANT/metadata/com.bitdm.bitdm.yml"
          # Das Rezept holt rustup als Srclib (fuer den Quellbau von libsignal).
          # In fdroiddata liegt die Beschreibung unter srclibs/, hier bringt
          # das Repo eine Kopie mit.
          mkdir -p "$HOME_VAGRANT/srclibs"
          cp quelle/secure-messenger/fdroid/srclibs/rustup.yml "$HOME_VAGRANT/srclibs/"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: fdroidserver
        run: |
          set -eu
          git init -q /opt/fdroidserver-bitdm
          git -C /opt/fdroidserver-bitdm fetch -q --depth 1 \
            https://gitlab.com/fdroid/fdroidserver.git "$FDROIDSERVER_COMMIT"
          git -C /opt/fdroidserver-bitdm checkout -q --detach "$FDROIDSERVER_COMMIT"

      # Dieselben Schritte wie der Auftrag "fdroid build" in fdroiddata
      # (.gitlab-ci.yml): als Benutzer vagrant, mit sudo fuer den sudo-Block
      # des Rezepts (fdroid build --on-server nimmt sudo danach wieder weg).
      - name: Bauen wie F-Droid
        run: |
          set -eux
          apt-get update
          apt-get install -y sudo openjdk-21-jdk-headless
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          for d in build tmp unsigned logs .android .gradle; do mkdir -p "$HOME_VAGRANT/$d"; done
          chown -R vagrant "$HOME_VAGRANT" /opt/fdroidserver-bitdm
          cd "$HOME_VAGRANT"
          # `fdroid` als vagrant; examples/ im Pfad, dort liegt das Plugin
          # fetchsrclibs. Im Modus --on-server holt `fdroid build` den
          # Quelltext NICHT selbst (das tut im Betrieb der Gastgeber) — ohne
          # fetchsrclibs davor endete der Lauf am 15.10.2026 mit
          # "NoSuchPathError: build/com.bitdm.bitdm".
          FD="sudo --preserve-env --user vagrant env PATH=/opt/fdroidserver-bitdm:$PATH PYTHONPATH=/opt/fdroidserver-bitdm:/opt/fdroidserver-bitdm/examples PYTHONUNBUFFERED=true HOME=$HOME_VAGRANT GRADLE_USER_HOME=$HOME_VAGRANT/.gradle fdroid"
          APP="com.bitdm.bitdm:${{ steps.rezept.outputs.code }}"
          $FD fetchsrclibs --verbose "$APP"
          # Als root in ein Repo von vagrant schauen verlangt safe.directory.
          git -c safe.directory='*' -C "$HOME_VAGRANT/build/com.bitdm.bitdm" log -1 --format='Quelle: %H'
          git -c safe.directory='*' -C "$HOME_VAGRANT/build/com.bitdm.bitdm" submodule status
          # fdroid build --on-server nimmt sudo nach dem sudo-Block des Rezepts
          # wieder weg; die folgenden Schritte laufen ohnehin als root.
          $FD build --verbose --test --refresh-scanner --on-server --no-tarball "$APP"

      - name: Unsignierte APK
        id: raus
        run: |
          set -eu
          APK="bitdm-${{ steps.rezept.outputs.version }}-unsigned.apk"
          mkdir -p "$GITHUB_WORKSPACE/aus"
          cp "$HOME_VAGRANT/tmp/com.bitdm.bitdm_${{ steps.rezept.outputs.code }}.apk" \
             "$GITHUB_WORKSPACE/aus/$APK"
          cd "$GITHUB_WORKSPACE/aus" && sha256sum "$APK" | tee "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "### $APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$APK.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # DIE BIBLIOTHEK IN DER APK MUSS DIE AUS DEM QUELLBAU SEIN. Gradle strippt
      # Native-Bibliotheken beim Packen noch einmal, die Datei in der APK ist
      # also nicht byte-gleich mit der von cargo. elf_pruefen.py vergleicht
      # deshalb die Build-ID, die libsignal-quellbau.sh setzt und die das
      # Strippen stehen laesst. Dazu darf der Hook keinen Download-Cache
      # angelegt haben. Die Groessen je ABI kommen in die Zusammenfassung.
      - name: libsignal aus der Quelle
        env:
          APK: ${{ steps.raus.outputs.apk }}
        run: |
          set -eu
          APP_DIR=$HOME_VAGRANT/build/com.bitdm.bitdm/secure-messenger/app
          if find "$APP_DIR/.dart_tool" -name .download-complete -path '*libsignal*' | grep .; then
            echo "::error::Der libsignal-Hook hat doch eine Binaerdatei heruntergeladen."
            exit 1
          fi
          rm -rf apk-libs && mkdir apk-libs
          unzip -q "aus/$APK" 'lib/*' -d apk-libs
          {
            echo '### Native Bibliotheken je ABI (Byte, unkomprimiert in der APK)'
            echo '| ABI | liblibsignal_frb.so | alle .so der ABI |'
            echo '|---|---:|---:|'
          } >> "$GITHUB_STEP_SUMMARY"
          for paar in arm64-v8a:aarch64-linux-android armeabi-v7a:armv7-linux-androideabi; do
            abi=${paar%%:*}
            ziel=${paar#*:}
            set -- "$APP_DIR"/.pub-cache/hosted/pub.dev/libsignal-*/rust/target/"$ziel"/release/liblibsignal_frb.so
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Kein Quellbau fuer $ziel gefunden."
              exit 1
            fi
            python3 -I quelle/secure-messenger/fdroid/elf_pruefen.py --gleich \
              "apk-libs/lib/$abi/liblibsignal_frb.so" "$1"
            echo "| $abi | $(stat -c %s "apk-libs/lib/$abi/liblibsignal_frb.so") | $(du -cb "apk-libs/lib/$abi/"*.so | tail -n1 | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "APK gesamt: $(stat -c %s "aus/$APK") Byte" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.lauf == 'erster' && 'android-unsigniert' || 'android-gegenprobe' }}
          path: ${{ github.workspace }}/aus/

  beglaubigen:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigniert
          path: aus
      # DASSELBE MUSTER WIE IN linux.yml, und aus demselben Grund: ein
      # Job-Output gehoert ueber `env:` ins Skript und nicht als `${{ }}` in
      # den Text, den die Shell danach auswertet. Hier ist die Lage besser —
      # der Name entsteht im Schritt „Rezept“, also VOR dem fremden Bau-Code,
      # und dieser Auftrag hat kein `contents: write`. Trotzdem gleich
      # umgestellt: wer sich auf „hier kommt der Wert aus einer guten Quelle“
      # verlaesst, prueft das bei der naechsten Aenderung nicht nachher.
      - name: APK-Namen pruefen
        id: pruefen
        env:
          APK: ${{ needs.bauen.outputs.apk }}
        run: |
          if [[ ! $APK =~ ^bitdm-[0-9]+\.[0-9]+\.[0-9]+-unsigned\.apk$ ]]; then
            echo "Unerwarteter APK-Name aus dem Bau-Auftrag." >&2
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Pruefsumme nachrechnen
        working-directory: aus
        env:
          APK: ${{ steps.pruefen.outputs.apk }}
        run: sha256sum -c "$APK.sha256"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: aus/${{ steps.pruefen.outputs.apk }}

  # Nur mit `gegenprobe`: zwei Bauten derselben Quelle auf getrennten Runnern
  # muessen bitgleich sein. F-Droid prueft spaeter genau das, nur mit seinem
  # eigenen Bau gegen unsere signierte APK. Weichen sie ab, nennt vergleich.py
  # die Eintraege.
  vergleichen:
    needs: bauen
    if: ${{ inputs.gegenprobe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: secure-messenger/fdroid
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigniert
          path: erster
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-gegenprobe
          path: zweiter
      - name: Bitgleich?
        env:
          APK: ${{ needs.bauen.outputs.apk }}
        run: |
          if [[ ! $APK =~ ^bitdm-[0-9]+\.[0-9]+\.[0-9]+-unsigned\.apk$ ]]; then
            echo "Unerwarteter APK-Name aus dem Bau-Auftrag." >&2
            exit 1
          fi
          echo '### Gegenprobe' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "erster/$APK" "zweiter/$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          if cmp -s "erster/$APK" "zweiter/$APK"; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '**Bitgleich.**' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -I secure-messenger/fdroid/vergleich.py "erster/$APK" "zweiter/$APK" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '**Nicht bitgleich.**' >> "$GITHUB_STEP_SUMMARY"
          exit 1
