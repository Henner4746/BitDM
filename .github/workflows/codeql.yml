# Statische Sicherheitsanalyse mit CodeQL — fuer oeffentliche Repos kostenlos.
#
# Seit 25.09.2026. Geprueft werden der Server (Python) und diese Workflows
# selbst (Sprache "actions": Injektion ueber ${{ }}, zu weite Rechte).
# Dart kennt CodeQL nicht; Kotlin braeuchte einen vollen Gradle-/Flutter-Bau
# und bleibt deshalb vorerst draussen. Funde erscheinen unter
# Security -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
