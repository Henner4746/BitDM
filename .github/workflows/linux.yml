# Linux-Fassung bauen — auf einem Linux-Runner von GitHub.
#
# Lokal hing der Bau an einem sudo in WSL, fuer das es ein Passwort braucht.
# Hier hat der Runner sudo. Bei einem Versions-Tag (v*) landet das Paket am
# Release; von Hand gestartet nur als Artefakt des Laufs.
name: Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: secure-messenger/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Werkzeuge fuer den Linux-Bau
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Paket schnueren
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/bitdm-linux-x64-$VERSION.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/bitdm-linux-x64-$VERSION.tar.gz"
          echo "PAKET=bitdm-linux-x64-$VERSION.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PAKET }}
          path: ${{ github.workspace }}/${{ env.PAKET }}
      - name: An den Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$GITHUB_WORKSPACE/$PAKET" --clobber -R "$GITHUB_REPOSITORY"
