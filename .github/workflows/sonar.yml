# SonarQube Cloud: statische Analyse von Dart (App), Kotlin (Android),
# Python (Relay), JavaScript/HTML (Web-Huelle, Seite) und Shell (Betrieb).
# Seit 18.10.2026. Ergebnis unter https://sonarcloud.io/project/overview?id=Henner4746_BitDM
#
# Braucht das Repo-Secret SONAR_TOKEN (Anleitung: secure-messenger/docs/SONAR-SNYK.md).
# Ohne Token, etwa bei einem Pull-Request aus einem fremden Fork, wird die
# Analyse uebersprungen statt rot.
#
# In SonarQube Cloud MUSS die "Automatic Analysis" aus sein, sonst lehnt der
# Server diesen Lauf ab ("CI analysis while Automatic Analysis is enabled").
name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token:
    runs-on: ubuntu-latest
    outputs:
      da: ${{ steps.pruefen.outputs.da }}
    steps:
      - id: pruefen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
          else
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN fehlt, Analyse uebersprungen (siehe secure-messenger/docs/SONAR-SNYK.md)."
          fi

  analyse:
    needs: token
    if: needs.token.outputs.da == 'ja'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Die ganze Geschichte: Sonar ordnet Befunde ueber git blame neuem
          # oder altem Code zu und kommentiert Pull-Requests nur mit ihr.
          fetch-depth: 0
          persist-credentials: false

      # Sonar verlangt fuer Dart die aufgeloesten Pakete (pubspec.lock), sonst
      # fehlen Typen und die Befunde werden unvollstaendig. Dieselbe
      # Flutter-Fassung wie in ci.yml und im Submodul secure-messenger/app/.flutter.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Pakete holen
        working-directory: secure-messenger/app
        run: flutter pub get --enforce-lockfile

      # VORHER KLAR SAGEN, WAS FEHLT. Beim ersten Lauf (18.10.2026) meldete der
      # Scanner nur "403 Forbidden" beim Holen der Java-Laufzeit. Dieser Schritt
      # prueft Token, Organisation und Projekt einzeln; das Token selbst taucht
      # nirgends auf (GitHub schwaerzt es ohnehin).
      - name: Zugang zu SonarQube Cloud pruefen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ORG=$(sed -n 's/^sonar.organization=//p' sonar-project.properties | tr -d '\r')
          PROJ=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties | tr -d '\r')
          api() { curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/$1"; }
          if ! api authentication/validate | grep -q '"valid":true'; then
            echo "::error::SONAR_TOKEN wird von SonarQube Cloud nicht angenommen. Neu erzeugen unter My Account -> Security und mit 'gh secret set SONAR_TOKEN --repo Henner4746/BitDM' eintragen."
            exit 1
          fi
          echo "Token: gueltig"
          if ! api "organizations/search?organizations=$ORG" | grep -q "\"key\":\"$ORG\""; then
            echo "::error::Organisation '$ORG' gibt es nicht oder das Token sieht sie nicht. Den Schluessel unter sonarcloud.io -> Organisation -> Information mit sonar-project.properties vergleichen."
            exit 1
          fi
          echo "Organisation $ORG: vorhanden"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/components/show?component=$PROJ")
          if [ "$code" != "200" ]; then
            echo "::error::Projekt '$PROJ' fehlt in SonarQube Cloud (HTTP $code). Dort '+ -> Analyze new project -> BitDM' mit 'With GitHub Actions' anlegen."
            exit 1
          fi
          echo "Projekt $PROJ: vorhanden"

      # Ab v6 laeuft die Aktion nicht mehr in einem Docker-Container und sieht
      # damit die eben geholten Pakete (Sonar-Doku zu Dart).
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
