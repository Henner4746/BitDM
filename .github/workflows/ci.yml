# Pruefung bei jedem Push und Pull-Request.
#
# Bis 25.09.2026 gab es keine: die Tests liefen nur, wenn jemand sie von Hand
# startete. Zwei Auftraege:
#   app     — flutter analyze + flutter test, auf WINDOWS, weil die Testhilfen
#             Relay und Zwischenlager mit `py` starten (dem Python-Starter von
#             Windows) und die Tests genau dort gepflegt werden.
#   server  — pytest fuer Relay und Zwischenlager, auf Linux wie im Betrieb.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 45
    # `py` nimmt sonst das neueste Python auf dem Runner, nicht das von
    # setup-python. Seit Python 3.15 dort liegt, fand pip fuer xeddsa kein
    # Wheel mehr, und die Testhilfen haetten Relay und Zwischenlager mit 3.15
    # gestartet. PY_PYTHON legt `py` fest, PY_PYTHON3 `py -3` (so ruft
    # test/support/python_befehl.dart den Relay auf) — beide auf dieselbe Fassung.
    env:
      PY_PYTHON: '3.12'
      PY_PYTHON3: '3.12'
    defaults:
      run:
        working-directory: secure-messenger/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Relay-Abhaengigkeiten (die Tests starten echte Server)
        run: 'py -m pip install --only-binary :all: --require-hashes -r ../server/requirements.txt'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: flutter test

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: secure-messenger/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: libsodium fuer XEdDSA
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      # --only-binary: nur fertige Wheels, kein Setup-Skript eines Pakets
      # laeuft beim Installieren (SonarQube Cloud, githubactions:S8541,
      # 18.10.2026). Fuer alle Relay-Pakete gibt es Wheels (3.10, 3.12,
      # Linux und Windows, nachgeprueft); die Hashes pruefen sie weiter.
      - run: 'pip install --only-binary :all: --require-hashes -r requirements.txt'
      - run: python -m pytest -q
