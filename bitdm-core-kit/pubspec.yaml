name: bitdm
description: "BitDM — E2E encrypted messenger (no phone, no username)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2 # Dart 3.12.2 (ships with Flutter 3.44.8)

dependencies:
  flutter:
    sdk: flutter

  # ---- UI (Person A) — pinned exact, resolved & building ----
  cupertino_icons: 1.0.9
  google_fonts: 6.3.3

  # ---- Core (Person B) — SUGGESTED. Uncomment + pin EXACT after
  #      `flutter pub add <pkg>` resolves the latest compatible version. ----
  #
  # Signal protocol (X3DH + Double Ratchet):
  # libsignal_protocol_dart: ^0.7.1      # confirm current version on pub.dev
  # WebSocket client to the relay:
  # web_socket_channel: ^3.0.1
  # REST for prekey bundles:
  # http: ^1.2.2
  # Encrypted key storage (Android Keystore):
  # flutter_secure_storage: ^9.2.2
  # Local encrypted message DB:
  # sqflite: ^2.4.1
  # path_provider: ^2.1.5
  # Stable message ids:
  # uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
