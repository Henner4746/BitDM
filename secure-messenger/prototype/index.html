/* ---- deterministic identicon / QR / waveform (ported from the design) ---- */
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; } return h; };

function avatar(id, size, pal, radius) {
  const h = hash(id); let cells = '';
  for (let i = 0; i < 9; i++) { const v = (h >>> (i * 3)) % pal.length; cells += `<div style="background:${pal[(v + i) % pal.length]}"></div>`; }
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:${size}px;height:${size}px;flex:none;border-radius:${radius};overflow:hidden">${cells}</div>`;
}
function qr(seed, fg, bg) {
  const n = 25, h = hash(seed); let cells = '';
  for (let i = 0; i < n * n; i++) {
    const r = Math.floor(i / n), c = i % n;
    const corner = (r < 7 && c < 7) || (r < 7 && c > n - 8) || (r > n - 8 && c < 7);
    let on;
    if (corner) { const rr = r < 7 ? r : n - 1 - r, cc = c < 7 ? c : n - 1 - c; on = Math.max(Math.abs(rr - 3), Math.abs(cc - 3)) !== 2; }
    else on = (((h ^ (i * 2654435761)) >>> 5) % 100) < 47;
    cells += `<div style="background:${on ? fg : bg}"></div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(${n},5px);grid-template-rows:repeat(${n},5px)">${cells}</div>`;
}
function wave(seed, color) {
  const h = hash(seed); let bars = '';
  for (let i = 0; i < 16; i++) bars += `<div style="width:2px;height:${4 + ((h >>> (i % 20)) % 12)}px;background:${color}"></div>`;
  return `<span style="display:inline-flex;align-items:flex-end;gap:2px;height:16px">${bars}</span>`;
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/* ---- state ---- */
function blank() {

    screen: 'onboard', chat: null, draft: '', addVal: '', reqSent: false,
    sheet: false, panic: false, wiped: false, copied: false, pending: true,
    contacts: [C1, C2],

    extra: {}, lang: 'en', mode: 'dark',
    auth: { bio: false, passkey: false, hw: false, totp: false },
    enroll: null, code: '',
    settings: { shot: true, rec: false, eph: '24h' }
  };
}

let devOpen = false;

const textOf = (code, t) => (state.extra[code] !== undefined ? state.extra[code] : (t[code] || ''));
const ephLabel = t => state.settings.eph === 'off' ? t.off : (state.settings.eph === '1h' ? t.h1 : (state.settings.eph === '7d' ? t.d7 : t.h24));
const addShort = () => state.addVal ? shortId(state.addVal.replace(/\s/g, '')) : shortId(C3);

/* ---- actions ---- */
function go(s) { state.screen = s; state.sheet = false; state.panic = false; render(); }
function send() {
  const d = state.draft.trim(); if (!d || !state.chat) return;
  const time = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  const key = 'x' + Object.keys(state.extra).length;
  state.extra[key] = d;
  const chat = state.chat;
  state.msgs[chat] = (state.msgs[chat] || []).concat([key + ':1:' + time]);
  state.draft = '';
  render();
  setTimeout(() => {
    if (state.chat !== chat) return;
    state.msgs[chat] = (state.msgs[chat] || []).concat(['reply:0:' + time]);
    render();
  }, 1100);
}
function startEnroll(key) {
  state.enroll = key; state.code = '';
  if (key !== 'totp') setTimeout(() => {
    if (state.enroll !== key) return;
    state.enroll = null; state.auth[key] = true; render();
  }, 1600);
  render();
}
function methodAct(key) {
  const on = state.auth[key];
  const activeCount = ['bio', 'passkey', 'hw', 'totp'].filter(x => state.auth[x]).length;
  if (on) { if (activeCount <= 1) return; state.auth[key] = false; render(); }
  else startEnroll(key);
}
const actions = {
  create() { state.screen = 'secure'; state.wiped = false; render(); },
  secureNext() { go('id'); },
  toChats() { go('chats'); },
  toAdd() { state.screen = 'add'; state.addVal = ''; state.reqSent = false; render(); },
  toId() { go('id'); },
  paste() { state.addVal = C3; render(); },
  sendReq() { state.reqSent = true; state.addVal = state.addVal || C3; render(); },
  simAccept() {
    const id = (state.addVal || C3).replace(/\s/g, '');
    if (state.contacts.indexOf(id) < 0) state.contacts = [id].concat(state.contacts);
    if (!state.msgs[id]) state.msgs[id] = [];
    state.reqSent = false; state.screen = 'chat'; state.chat = id; render();
  },
  acceptReq() {
    if (!state.msgs[C3]) state.msgs[C3] = [];
    state.pending = false; state.contacts = [C3].concat(state.contacts);
    state.screen = 'chat'; state.chat = C3; render();
  },
  declineReq() { state.pending = false; render(); },
  openChat(id) { state.screen = 'chat'; state.chat = id; state.sheet = false; render(); },
  openSheet() { state.sheet = true; render(); },
  closeSheet() { state.sheet = false; render(); },
  askPanic() { state.panic = true; render(); },
  closePanic() { state.panic = false; render(); },
  doWipe() { const lang = state.lang, mode = state.mode; state = blank(); state.wiped = true; state.pending = false; state.lang = lang; state.mode = mode; render(); },
  copy() { state.copied = true; render(); setTimeout(() => { state.copied = false; render(); }, 1400); },
  send() { send(); },
  tShot() { state.settings.shot = !state.settings.shot; render(); },
  tRec() { state.settings.rec = !state.settings.rec; render(); },
  method(k) { methodAct(k); },
  enrollCancel() { state.enroll = null; state.code = ''; render(); },
  confirmTotp() { if (state.code.length < 6) return; state.auth.totp = true; state.enroll = null; state.code = ''; render(); },
  navGo(s) { go(s); },
  jumpGo(code) { devOpen = false; state.screen = code; if (!state.chat) state.chat = C1; state.sheet = false; state.panic = false; render(); },
  devToggle() { devOpen = !devOpen; render(); },
  pickLang(l) { state.lang = l; render(); },
  pickMode(m) { state.mode = m; render(); },
  pickEph(v) { state.settings.eph = v; render(); }
};

function computeMethods(t) {
  const M = [['bio', t.bio, t.bioSub], ['passkey', t.passkey, t.passkeySub], ['hw', t.hw, t.hwSub], ['totp', t.totp, t.totpSub]];
  return M.map(m => {

    return {
      key: m[0], label: m[1], sub: m[2], on, mark: on ? '✓' : '·',
      status: on ? t.on2 : t.offMethod, action: on ? t.remove : t.add,

  });
}
const methodRow = (m, right) => `<div data-act="method" data-arg="${m.key}" data-ripple="1" data-h="surf" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:11.2px;padding:11.2px;border-radius:8px;background:var(--surf2);cursor:pointer;color:var(--ink)">

    <div style="display:flex;flex-direction:column;gap:2.8px;margin-bottom:22.4px">
      <div data-act="tShot" data-ripple="1" style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16.8px;padding:11.2px;border-radius:8px;background:var(--surf2);cursor:pointer;color:var(--ink)">
        <div><div style="font-size:13.5px">${t.screenshot}</div><div style="font-size:11px;color:var(--dim)">${t.screenshotSub}</div></div>
        <div style="${sw(state.settings.shot)}"><div style="${kn(state.settings.shot)}"></div></div>
      </div>
      <div data-act="tRec" data-ripple="1" style="position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16.8px;padding:11.2px;border-radius:8px;background:var(--surf2);cursor:pointer;color:var(--ink)">
        <div><div style="font-size:13.5px">${t.readReceipts}</div><div style="font-size:11px;color:var(--dim)">${t.readReceiptsSub}</div></div>
        <div style="${sw(state.settings.rec)}"><div style="${kn(state.settings.rec)}"></div></div>
      </div>
      <div style="padding:11.2px;border-radius:8px;background:var(--surf2);display:flex;flex-direction:column;gap:8.4px">
        <div><div style="font-size:13.5px">${t.selfDestruct}</div><div style="font-size:11px;color:var(--dim)">${t.selfDestructSub}</div></div>
        <div style="display:flex;gap:2.8px;padding:2.8px;border-radius:8px;background:var(--bg)">${ephOpts}</div>
      </div>
    </div>
    ${H6(t.identity)}
    <div style="display:flex;flex-direction:column;gap:2.8px;margin-bottom:22.4px">
      <div data-act="toId" data-ripple="1" data-h="surf" style="position:relative;overflow:hidden;padding:11.2px;border-radius:8px;background:var(--surf2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:11.2px;color:var(--ink)">
        <span style="font-size:13.5px">${t.myIdQr}</span><span style="font:600 12.5px Doto,monospace;letter-spacing:0.08em;color:var(--dim)">${shortId(MY_ID)}</span>
      </div>
      <div style="padding:11.2px;border-radius:8px;background:var(--surf2);display:flex;justify-content:space-between;align-items:center;gap:11.2px">
        <span style="font-size:13.5px">${t.fingerprint}</span><span style="font:600 12.5px Doto,monospace;letter-spacing:0.08em;color:var(--dim)">b7d2 4e10 9af3</span>
      </div>
    </div>
    ${H6(t.emergency)}
    <div data-act="askPanic" data-ripple="1" data-h="line" style="position:relative;overflow:hidden;padding:11.2px;border-radius:8px;background:var(--tint);border:1px solid var(--tintLine);cursor:pointer;color:var(--tintInk)">
      <div style="font-size:13.5px">${t.panic}</div>
      <div style="font-size:11px;color:var(--muted);text-wrap:pretty">${t.panicSub}</div>
    </div>
  </div>${panic}`;
}
function enrollModal(t) {
  const en = state.enroll;
  const title = en === 'bio' ? t.enrollBio : en === 'passkey' ? t.enrollPasskey : en === 'hw' ? t.enrollHw : t.enrollTotp;
  const body = en === 'bio' ? t.enrollBioBody : en === 'passkey' ? t.enrollPasskeyBody : en === 'hw' ? t.enrollHwBody : t.enrollTotpBody;
  const isTotp = en === 'totp';
  const ready = state.code.length === 6;
  const waiting = !isTotp ? `<div style="display:flex;align-items:center;gap:11.2px;padding:14px;border-radius:8px;background:var(--tint);border:1px solid var(--tintLine)">
      <div style="width:34px;height:34px;border-radius:99px;border:1px solid var(--accent);animation:bd-scan 1.1s ease-in-out infinite"></div>
      <div style="font:500 11px 'Chivo Mono',monospace;letter-spacing:0.14em;text-transform:uppercase;color:var(--tintInk)">${t.waiting}</div>
    </div>` : '';
  const totp = isTotp ? `<div style="display:flex;flex-direction:column;gap:8.4px">
      <div style="padding:11.2px;border-radius:8px;background:var(--surf2)">
        <div style="font:400 10px 'Chivo Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);margin-bottom:4px">${t.secret}</div>
        <div style="font:600 15px Doto,monospace;letter-spacing:0.14em;color:var(--ink)">JBSW Y3DP EHPK 3PXP</div>
      </div>
      <label style="font:400 10px 'Chivo Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim)">${t.codeLabel}</label>
      <input id="codeInput" value="${state.code}" placeholder="000000" inputmode="numeric" style="width:100%;padding:11.2px;border-radius:8px;font:600 22px/1 Doto,monospace;letter-spacing:0.4em;background:var(--surf2);border:1px solid var(--line);color:var(--ink)">
    </div>` : '';
  const confirmBtn = isTotp ? `<button data-act="confirmTotp" style="flex:1;padding:11.2px;border-radius:8px;background:${ready ? 'var(--wash)' : 'transparent'};font:600 12px 'Chivo Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border:1px solid ${ready ? 'var(--accent)' : 'var(--line)'};color:${ready ? 'var(--ink)' : 'var(--dim)'}">${t.confirm}</button>` : '';
  return `<div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end">
    <div style="width:100%;padding:22.4px;border-radius:14px 14px 16px 16px;background:var(--surf);box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,0.5);display:flex;flex-direction:column;gap:11.2px">
      <div style="width:36px;height:3px;border-radius:99px;background:var(--line);align-self:center"></div>
      <h4 style="font:700 20px/1.1 Doto,monospace;text-transform:uppercase;letter-spacing:0.02em;margin:0">${title}</h4>
      <p style="margin:0;font-size:12px;color:var(--muted);text-wrap:pretty">${body}</p>
      ${waiting}${totp}
      <div style="display:flex;gap:8.4px;margin-top:2.8px">
        <button data-act="enrollCancel" data-h="line" style="flex:1;padding:11.2px;border-radius:8px;background:transparent;font:400 12px/1 'Chivo Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border:1px solid var(--line);color:var(--muted)">${t.cancel}</button>
        ${confirmBtn}
      </div>
    </div>
  </div>`;
}
function navBar(t) {
  const active = state.screen === 'chat' ? 'chats' : state.screen;
  return `<div style="flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--lineSoft);background:var(--navbg)">
    ${[['chats', t.navChats], ['id', t.navId], ['set', t.navSet]].map(n => {
      const on = active === n[0];
      return `<button data-act="navGo" data-arg="${n[0]}" style="position:relative;overflow:hidden;padding:11.2px 5.6px 15px;background:transparent;border:0;border-top:2px solid ${on ? 'var(--accent)' : 'transparent'};cursor:pointer;font:500 10.5px 'Chivo Mono',monospace;letter-spacing:0.12em;text-transform:uppercase;color:${on ? 'var(--ink)' : 'var(--dim)'}">${n[1]}</button>`;
    }).join('')}
  </div>`;
}
function header(t) {
  return `<div style="margin-bottom:16px;display:flex;flex-direction:column;gap:4px">
    <div style="font:800 15px/1.2 Doto,monospace;letter-spacing:0.2em;text-transform:uppercase;color:#9184d9">BitDM — Nocturne</div>
    <div style="font:300 12px/1.5 'Chivo Mono',monospace;color:#9397ab;max-width:430px">Live prototype · mock data, no real crypto yet · language &amp; theme switch live in Settings.</div>
  </div>`;
}
function floatingDev(t) {
  const items = SCREEN_CODES.map((code, i) => `<button data-act="jumpGo" data-arg="${code}" style="padding:8px 10px;border-radius:6px;cursor:pointer;font:500 11px 'Chivo Mono',monospace;letter-spacing:0.08em;border:1px solid ${state.screen === code ? '#9184d9' : '#3f424d'};background:${state.screen === code ? 'rgba(145,132,217,0.16)' : 'transparent'};color:${state.screen === code ? '#d2cefd' : '#9397ab'}">${t.jump[i]}</button>`).join('');
  return `<button data-act="devToggle" aria-label="screens" style="position:fixed;right:14px;bottom:14px;z-index:60;width:46px;height:46px;border-radius:99px;border:1px solid #9184d9;background:rgba(22,24,38,0.85);color:#b5abfc;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.5)">≡</button>${devOpen ? `<div data-act="devToggle" style="position:fixed;inset:0;z-index:59;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center;padding:16px">
    <div data-devpanel="1" style="width:100%;max-width:440px;background:#161826;border:1px solid #3f424d;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:6px">
      <div style="width:100%;font:600 10px 'Chivo Mono',monospace;letter-spacing:0.16em;text-transform:uppercase;color:#9397ab;margin-bottom:2px">Screens · dev jump</div>
      ${items}
    </div>
  </div>` : ''}`;
}
function jumpBar(t) {
  const codes = ['onboard', 'secure', 'id', 'add', 'chats', 'chat', 'set'];
  return `<div style="display:flex;flex-wrap:wrap;gap:5.6px;margin-top:16px;max-width:392px">${codes.map((code, i) => {
    const on = state.screen === code;
    return `<button data-act="jumpGo" data-arg="${code}" style="position:relative;overflow:hidden;padding:6px 9px;border-radius:4px;cursor:pointer;font:500 10.5px 'Chivo Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;border:1px solid ${on ? '#9184d9' : '#3f424d'};background:${on ? 'rgba(145,132,217,0.16)' : 'transparent'};color:${on ? '#d2cefd' : '#9397ab'}">${t.jump[i]}</button>`;
  }).join('')}</div>`;
}

/* ---- render + wire ---- */
function render() {
  const t = STR[state.lang];
  const c = PALETTE[state.mode];
  const avp = AVPAL[state.mode];
  const sc = state.screen;
  const vars = Object.keys(c).map(k => `--${k}:${c[k]}`).join(';');

  let screen = '';
  if (sc === 'onboard') screen = scrOnboard(t);
  else if (sc === 'secure') screen = scrSecure(t);
  else if (sc === 'id') screen = scrId(t, c);
  else if (sc === 'add') screen = scrAdd(t);
  else if (sc === 'chats') screen = scrChats(t, c, avp);
  else if (sc === 'chat') screen = scrChat(t, c, avp);
  else if (sc === 'set') screen = scrSet(t, c);

  const overlay = state.enroll ? enrollModal(t) : '';
  const nav = (sc === 'chats' || sc === 'id' || sc === 'set') ? navBar(t) : '';
  const statusbar = `<div style="height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:500 11px/1 'Chivo Mono',monospace;letter-spacing:0.08em;color:var(--muted)"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><span>VPN</span><span>▮▮▮</span><span>84%</span></span></div>`;

  const mobile = isMobile();
  const inner = `${mobile ? '' : statusbar}${screen}${overlay}${nav}`;

  // preserve focus + caret across re-render
  const act = document.activeElement;
  const activeId = act && act.id;
  let selS = null, selE = null;
  try { if (act && 'selectionStart' in act) { selS = act.selectionStart; selE = act.selectionEnd; } } catch (e) {}

  if (mobile) {
    app.innerHTML = `<div class="wrap-m" style="${vars}"><div class="screen-m">${inner}</div>${floatingDev(t)}</div>`;
  } else {
    const phone = `<div style="width:392px;padding:6px;border-radius:22px;background:var(--shell);box-shadow:0 16px 40px rgba(0,0,0,0.5);transition:background 240ms ease"><div style="width:380px;height:812px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:14px;line-height:1.55;background:var(--bg);color:var(--ink);transition:background 240ms ease,color 240ms ease">${inner}</div></div>`;
    app.innerHTML = `<div class="wrap" style="${vars}">${header(t)}${phone}${jumpBar(t)}</div>`;
  }
  bind();

  if (activeId) { const el = $(activeId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selE); } catch (e) {} } }
  const ms = $('msgScroll'); if (ms) ms.scrollTop = ms.scrollHeight;
}
function bind() {
  app.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', e => {
      const a = el.getAttribute('data-act');
      if (a === 'simAccept') e.preventDefault();
      const fn = actions[a]; if (!fn) return;
      if (ARG_ACTS.indexOf(a) >= 0) fn(el.getAttribute('data-arg')); else fn();
    });
  });
  const draft = $('draftInput');
  if (draft) {
    draft.addEventListener('input', e => { state.draft = e.target.value; });
    draft.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
  }
  const add = $('addInput');
  if (add) add.addEventListener('input', e => { state.addVal = e.target.value; });
  const code = $('codeInput');
  if (code) code.addEventListener('input', e => { state.code = e.target.value.replace(/[^0-9]/g, '').slice(0, 6); render(); });
  const card = app.querySelector('[data-sheetcard]');
  if (card) card.addEventListener('click', e => e.stopPropagation());
  const dp = app.querySelector('[data-devpanel]');
  if (dp) dp.addEventListener('click', e => e.stopPropagation());
}

let _resizeT;
window.addEventListener('resize', () => { clearTimeout(_resizeT); _resizeT = setTimeout(render, 150); });
if ('serviceWorker' in navigator && window.isSecureContext) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
render();
</script>
</body>
</html>
