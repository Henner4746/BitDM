AntiFeatures:
  TetheredNet:
    en-US: Messages go through the developer's relay (relay.bitdm.net). The relay
      is free software and can be self-hosted, but its address can only be changed
      at build time, not in the app.
    de-DE: Nachrichten laufen über den Relay des Entwicklers (relay.bitdm.net). Der
      Relay ist freie Software und selbst betreibbar, seine Adresse lässt sich aber
      nur beim Bauen ändern, nicht in der App.
Categories:
  - Connectivity
  - Messaging
License: AGPL-3.0-only
AuthorName: Henner4746
WebSite: https://bitdm.net
SourceCode: https://github.com/Henner4746/BitDM
IssueTracker: https://github.com/Henner4746/BitDM/issues
Changelog: https://github.com/Henner4746/BitDM/blob/HEAD/CHANGELOG.md

AutoName: BitDM

RepoType: git
Repo: https://github.com/Henner4746/BitDM.git
Binaries: https://github.com/Henner4746/BitDM/releases/download/v%v/bitdm-%v.apk

Builds:
  - versionName: 2.0.0
    versionCode: 22
    commit: '0000000000000000000000000000000000000000'
    subdir: secure-messenger/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
      - apt-get install -y gcc libc6-dev protobuf-compiler
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - rustup@1.29.1
    rm:
      - secure-messenger/app/linux
      - secure-messenger/app/windows
      - secure-messenger/app/web
      - secure-messenger/nah-test
      - secure-messenger/prototype
      - secure-messenger/website
      - bitdm-core-kit
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
    scanignore:
      - secure-messenger/app/.flutter/bin/cache
    scandelete:
      - secure-messenger/app/.flutter
      - secure-messenger/app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - bash ../fdroid/libsignal-quellbau.sh $$rustup$$
      - .flutter/bin/flutter build apk --release --target-platform android-arm,android-arm64
    ndk: r28c

AllowedAPKSigningKeys: e325b01c08a1a679b6aac20ac9ae3ee255591b46b37dd92717f97085acc22063

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
UpdateCheckData: secure-messenger/app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.0.0
CurrentVersionCode: 22
