# BitDM im eigenen F-Droid-Verzeichnis (bitdm.net/fdroid).
#
# Ausgangspunkt war das Rezept fuer fdroiddata (../com.bitdm.bitdm.yml). Der
# Bau-Block fehlt hier mit Absicht: dieses Verzeichnis baut nicht, es nimmt
# die signierte Release-APK. Name, Kurz- und Langbeschreibung, Bilder und
# Changelogs kommen aus app/fastlane/metadata/android/ im Release-Tag —
# veroeffentlichen.sh legt sie als metadata/com.bitdm.bitdm/ daneben.

AntiFeatures:
  TetheredNet:
    en-US: Messages go through the developer's relay (relay.bitdm.net). The relay
      is free software and can be self-hosted, but its address can only be changed
      at build time, not in the app.
    de-DE: Nachrichten laufen über den Relay des Entwicklers (relay.bitdm.net). Der
      Relay ist freie Software und selbst betreibbar, seine Adresse lässt sich aber
      nur beim Bauen ändern, nicht in der App.
