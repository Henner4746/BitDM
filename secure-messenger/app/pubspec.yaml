name: bitdm
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# FALLE, DIE EINEN HALBEN ABEND KOSTEN KANN: mit --split-per-abi rechnet
# Flutter einen ABI-Zuschlag auf den versionCode — arm64 bekommt 2000 dazu,
# armeabi-v7a 1000, x86_64 3000. Ein Build OHNE --split-per-abi hat dagegen
# den blanken Wert. Wer zwischen beiden hin- und herwechselt, baut versehentlich
# ein Downgrade, und Android lehnt die Installation ab, ohne einen brauchbaren
# Grund zu nennen.
#
# Deshalb: Testbauten IMMER mit --split-per-abi, und diese Zahl nur nach oben.
version: 1.8.0+16

environment:
  sdk: ^3.12.2

# Waehlt aus, welches SQLite package:sqlite3 einbindet.
#
# `sqlite3mc` ist SQLite3MultipleCiphers — dasselbe SQLite, ergaenzt um
# Verschluesselung der gesamten Datei. Ohne diese Zeile bindet package:sqlite3
# das gewoehnliche SQLite ein, und `PRAGMA key` waere still wirkungslos: die
# Datenbank laege im Klartext auf dem Geraet, ohne dass irgendetwas fehlschlaegt.
# Genau davor schuetzt der Test in test/store/encrypted_database_test.dart, der
# die Rohbytes der Datei ansieht.
#
# Warum nicht SQLCipher: package:sqlite3 unterstuetzt zwar `source: sqlcipher`,
# aber der Autor raet fuer neue Projekte zu sqlite3mc. sqlite3mc kann bestehende
# SQLCipher-Dateien lesen, umgekehrt nicht — die Wahl haelt also mehr offen.
#
# OFFEN FUER F-DROID: In dieser Form LAEDT der Hook beim Bauen eine fertige
# libsqlite3mc.so von den GitHub-Releases von package:sqlite3 herunter, statt
# sie zu uebersetzen. Der Reproduzierbarkeit schadet das nicht — die Datei wird
# gegen einen SHA-256-Wert geprueft, der in der gepinnten Paketfassung steht,
# und bei Abweichung bricht der Bau ab. Aber es ist eine Bibliothek, die BitDM
# nicht selbst gebaut hat, und F-Droid baut grundsaetzlich aus Quelltext.
#
# Ausweg, wenn es soweit ist: die Amalgamation von SQLite3MultipleCiphers
# (eine einzelne .c-Datei) ins Repo legen und hier auf
#   source: source
#   path: third_party/sqlite3mc_amalgamation.c
# umstellen. Das aendert an keiner Zeile Dart-Code etwas.
#
# SEIT 25.09.2026 SO: die Amalgamation liegt in third_party/sqlite3mc/ (Fassung
# und Pruefsumme im README dort), und der Hook uebersetzt sie selbst.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3mc/sqlite3mc_amalgamation.c

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Alle Versionen sind EXAKT gepinnt (kein ^), nicht aus Vorsicht, sondern
  # weil F-Droid reproduzierbare Builds verlangt: derselbe Quellstand muss
  # bitgleiche Artefakte erzeugen. Caret-Bereiche loesen sich je nach
  # Aufloesungszeitpunkt unterschiedlich auf und brechen das.
  cupertino_icons: 1.0.9

  # Krypto-Primitive: HKDF, PBKDF2, SHA-256, X25519.
  # Verifizierter Publisher (dint.dev), ~471k Downloads/Woche.
  #
  # BIP39 selbst ist BEWUSST nicht als Paket eingebunden: das gaengige `bip39`
  # ist fuenf Jahre alt und stammt von einem unverifizierten Uploader. Es sitzt
  # aber an der Wurzel saemtlicher Schluessel. BIP39 ist ohnehin kein
  # Krypto-Primitiv, sondern eine Kodierung ueber PBKDF2 — die riskanten Teile
  # kommen aus diesem Paket, der Rest liegt in lib/core/crypto/bip39.dart und
  # ist gegen die offiziellen Testvektoren geprueft.
  cryptography: 2.9.0
  libsignal_protocol_dart: 0.8.2

  # Verschluesselte lokale Datenbank.
  #
  # sqlite3 statt sqflite: die FFI-Anbindung arbeitet synchron und ohne
  # Platform-Channel. Das spart pro Abfrage eine Runde ueber den
  # Nachrichtenkanal und laesst sich sauber in ein Isolate legen — beides
  # zaehlt fuer das Ziel, sparsam mit Akku und Speicher umzugehen.
  #
  # Verifizierter Publisher (simonbinder.eu), MIT. Loest sqlcipher_flutter_libs
  # ab, das seit 0.7.0+eol nichts mehr tut.
  sqlite3: 3.5.0

  # Die Browser-Schnittstellen fuer die Web-Fassung: WebSocket und fetch zum
  # Relay (lib/core/net/netz_zugang_web.dart), localStorage fuer die Fachdatei
  # und Download/Dateiwahl fuer Sicherungen (lib/core/browser/). Vom Dart-Team
  # (dart.dev, verifiziert), BSD-3-Clause.
  #
  # KEINE NEUE ABHAENGIGKEIT im eigentlichen Sinn: package:sqlite3 zieht genau
  # diese Fassung schon mit (stand vorher als "transitive" in pubspec.lock).
  # Hier steht sie, weil der Code sie jetzt direkt benutzt und nicht davon
  # abhaengen darf, dass ein anderes Paket sie zufaellig mitbringt — dieselbe
  # Begruendung wie bei pointycastle. Nur in Dateien importiert, die fuer Web
  # uebersetzt werden (Weichen auf dart.library.io); Android sieht sie nicht.
  web: 1.1.1

  # Der Schluesselspeicher des Geraets — hier liegt die Entropie, aus der die
  # gesamte Identitaet entsteht. Verifizierter Publisher (steenbakker.dev),
  # BSD-3-Clause.
  #
  # Wird ueber lib/core/secret_store.dart angesprochen, nie direkt: das Paket
  # ist ein Plattform-Plugin und laeuft in Tests nicht. Die Schnittstelle davor
  # laesst sich ersetzen — und spaeter durch die App-Sperre (lib/core/lock/)
  # ablOesen, ohne dass der Kern etwas davon merkt.
  flutter_secure_storage: 11.2.0

  # Wo die verschluesselte Datenbank liegen darf. Vom Flutter-Team selbst
  # (flutter.dev, verifiziert). Braucht es, weil der Pfad je Plattform anders
  # ist und nur das System ihn kennt.
  path_provider: 2.1.6
  camera: ^0.12.0+2
  zxing2: ^0.2.4
  flutter_local_notifications: ^22.2.0
  nfc_manager: ^4.2.1
  cbor: ^6.5.1

  # ECDH auf P-256 fuer den Sicherheitsschluessel (lib/core/fido/).
  #
  # NICHT package:cryptography: dessen reine Dart-Umsetzung von ECDH wirft
  # UnimplementedError und funktioniert nur dort, wo eine native Gegenstelle
  # danebensteht. Auf dem Telefon waere das genauso gescheitert wie im Test —
  # aufgefallen ist es nur, weil der Test es zuerst versucht hat.
  #
  # pointycastle kam ueber libsignal ohnehin schon mit und rechnet in reinem
  # Dart, auf jeder Plattform gleich. Steht jetzt ausdruecklich hier, weil der
  # Code es direkt benutzt und nicht davon abhaengen darf, dass ein anderes
  # Paket es zufaellig mitbringt.
  pointycastle: 4.0.0
  unifiedpush: ^6.2.0
  url_launcher: ^6.3.2

  # google_fonts wurde bewusst ENTFERNT: es laedt Schriften zur Laufzeit von
  # fonts.gstatic.com nach und verraet Google damit bei jedem Kaltstart IP und
  # Zeitstempel. In einer App ohne Telefonnummer und ohne Username ist das ein
  # Selbstwiderspruch. Doto und Chivo Mono liegen jetzt unter assets/fonts/.
  # Nebeneffekt: http und crypto waren nur ueber google_fonts transitiv
  # eingebunden und sind damit ebenfalls verschwunden.
  #
  # webcrypto wurde am 25.07.2026 PROBEWEISE aufgenommen und wieder entfernt.
  # Es bindet BoringSSL an und waere fuer AES-GCM um ein Vielfaches schneller
  # als die reine Dart-Umsetzung. `flutter test` braucht dafuer
  # `pub run webcrypto:setup`, und das braucht cmake.
  #
  # KORREKTUR VOM SELBEN ABEND: cmake IST da, es liegt im Android-SDK
  # (Sdk/cmake/3.22.1) und war nur nicht im Pfad. Der erste Grund fuer die
  # Entscheidung war also falsch. Ob der Rest der Werkzeugkette fuer einen
  # Bau auf dem Entwicklungsrechner steht (C-Uebersetzer), ist ungeprueft.
  #
  # WAS DIE ENTSCHEIDUNG JETZT TRAEGT, ist eine Messung auf dem ECHTEN Geraet
  # statt auf dem Desktop (integration_test/anhang_tempo_test.dart, Galaxy
  # S25 Ultra, Android 16):
  #
  #     verschluesseln  8,0 MB/s   entschluesseln  5,3 MB/s
  #
  # Also SCHLECHTER als die 12 MB/s vom Entwicklungsrechner, und Entschluesseln
  # noch einmal deutlich langsamer. Fuer den Regelfall — Anhaenge ueber
  # Mobilfunk — reicht es weiterhin: die Leitung ist langsamer, und
  # Verschluesseln laeuft parallel zum Uebertragen. Ueber schnelles WLAN ist es
  # die Bremse, und drei Gigabyte kosten allein 6,4 Minuten Rechenzeit.
  #
  # Das ist ein offener Punkt und kein erledigter. Siehe
  # lib/core/anhang/stueck_krypto.dart: die Verschluesselung sitzt hinter einer
  # schmalen Schnittstelle und laesst sich austauschen, ohne dass der Rest des
  # Anhang-Wegs etwas merkt.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Tests, die auf dem ECHTEN Geraet laufen statt auf dem
  # Entwicklungsrechner. Kommt aus dem Flutter-SDK, ist also keine neue
  # Abhaengigkeit aus dem Netz.
  #
  #   flutter test integration_test/... -d <geraet>
  #
  # Gebraucht wird das dort, wo die Antwort vom Geraet abhaengt und nicht vom
  # Rechner: Geschwindigkeit der Verschluesselung, Schluesselspeicher,
  # Biometrie.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: 6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Lokal eingebettete Schriften — die App stellt zur Laufzeit KEINE
  # Netzwerkanfrage fuer Typografie. Beides sind Variable Fonts mit
  # wght-Achse, eine Datei deckt daher alle genutzten Schnitte (w300-w900) ab.
  # Lizenz: SIL Open Font License, siehe assets/fonts/OFL-*.txt
  # (OFL ist mit AGPL-3.0 vereinbar und fuer F-Droid unproblematisch).
  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: Chivo Mono
      fonts:
        - asset: assets/fonts/ChivoMono.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
