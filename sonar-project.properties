# SonarQube Cloud fuer BitDM (seit 18.10.2026), Lauf: .github/workflows/sonar.yml
#
# Organisation und Projektschluessel zeigt SonarQube Cloud nach dem Import
# unter "Information". Weichen sie von den Werten hier ab, gelten die dort.
sonar.organization=henner4746
sonar.projectKey=Henner4746_BitDM
sonar.projectName=BitDM
sonar.sourceEncoding=UTF-8

# Eigener Code: App, Android-Teil, Web-Huelle, Relay, Website, Betrieb,
# Werkzeuge und die eigenen Workflows.
#
# WICHTIG: In SonarQube Cloud muss "Automatic Analysis" AUS sein. Sie liest
# diese Datei nicht, prueft alles (auch das eingebettete SQLite und das
# Flutter-SDK, am 18.10.2026 488 von 539 Befunden) und erfasst Dart gar nicht.
sonar.sources=.github,\
  secure-messenger/app/lib,\
  secure-messenger/app/android/app/src/main,\
  secure-messenger/app/web,\
  secure-messenger/server,\
  secure-messenger/website,\
  secure-messenger/deploy,\
  secure-messenger/fdroid,\
  secure-messenger/app/tool,\
  secure-messenger/app/tools,\
  secure-messenger/tools

sonar.tests=secure-messenger/app/test,\
  secure-messenger/app/integration_test,\
  secure-messenger/app/android/app/src/test,\
  secure-messenger/server
sonar.test.inclusions=secure-messenger/app/test/**,\
  secure-messenger/app/integration_test/**,\
  secure-messenger/app/android/app/src/test/**,\
  secure-messenger/server/test_*.py

# Draussen: Tests in den Quellen (stehen oben unter sonar.tests), Gebautes,
# eingebettete Fremddateien (Flutter-Submodul, libsignal-WASM, Schriften,
# Web-App-Bau auf dem Server) und Binaerdateien.
sonar.exclusions=secure-messenger/server/test_*.py,\
  **/build/**,\
  **/.dart_tool/**,\
  secure-messenger/app/.flutter/**,\
  secure-messenger/app/third_party/**,\
  secure-messenger/nah-test/**,\
  bitdm-core-kit/**,\
  secure-messenger/app/web/pkg/**,\
  secure-messenger/app/web/fontfallback/**,\
  secure-messenger/website/app/**,\
  secure-messenger/website/app.alt/**,\
  secure-messenger/website/fonts/**,\
  secure-messenger/website/bilder/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.apk,**/*.exe,**/*.zip,**/*.tar.gz,**/*.ttf,**/*.woff2,**/*.png

# C und C++ (Windows- und Linux-Starter) bleiben aus: ohne Build-Wrapper
# bricht die Analyse sonst ab. Die Starter sind duenn; die Logik liegt in Dart.
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Der Relay laeuft auf dem Server mit Python 3.10.
sonar.python.version=3.10

# BEWUSST ANGENOMMEN (Pruefung des ersten Laufs am 18.10.2026). Jede Regel
# hier ist gelesen und bewertet; neue Befunde derselben Regel an anderer
# Stelle erscheinen weiter, sofern sie nicht unter dasselbe Muster fallen.
sonar.issue.ignore.multicriteria=wa1,wa2,wa3,wa4,wa5,wa6,klammern,verschleiern,vorlage,umleitung,scorecard,blobopen

# Entwickler-Werkzeuge nehmen Pfade und Argumente von der Person, die sie
# startet; es gibt keine fremde Eingabe ("LLM-supplied CLI arguments").
# NUR die Werkzeug-Ordner: Relay und Zwischenlager (server/) bleiben geprueft.
sonar.issue.ignore.multicriteria.wa1.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.wa1.resourceKey=secure-messenger/app/tool/**
sonar.issue.ignore.multicriteria.wa2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.wa2.resourceKey=secure-messenger/app/tool/**
sonar.issue.ignore.multicriteria.wa3.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.wa3.resourceKey=secure-messenger/tools/**
sonar.issue.ignore.multicriteria.wa4.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.wa4.resourceKey=secure-messenger/tools/**
sonar.issue.ignore.multicriteria.wa5.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.wa5.resourceKey=secure-messenger/fdroid/*.py
sonar.issue.ignore.multicriteria.wa6.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.wa6.resourceKey=secure-messenger/fdroid/*.py

# [ statt [[ in Shell: [ ist POSIX und in diesen Skripten richtig; eine
# Stilfrage, kein Fehler.
sonar.issue.ignore.multicriteria.klammern.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.klammern.resourceKey=**/*.sh

# Verschleierung (R8) im Release: BitDM ist quelloffen, Verschleiern schuetzt
# nichts und erschwert Fehlerberichte und den bitgleichen Nachbau.
sonar.issue.ignore.multicriteria.verschleiern.ruleKey=kotlin:S7204
sonar.issue.ignore.multicriteria.verschleiern.resourceKey=secure-messenger/app/android/**

# Platzhalter {{flutter_js}} / {{flutter_build_config}}, die Flutter beim Bau
# ersetzt; kein ausgefuehrter Ausdruck.
sonar.issue.ignore.multicriteria.vorlage.ruleKey=javascript:S905
sonar.issue.ignore.multicriteria.vorlage.resourceKey=secure-messenger/app/web/flutter_bootstrap.js

# Die Abnahme prueft ABSICHTLICH, dass http:// auf https umgeleitet wird.
sonar.issue.ignore.multicriteria.umleitung.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.umleitung.resourceKey=secure-messenger/server/abnahme_zwischenlager.sh

# Scorecard verlangt read-all auf oberster Ebene (offizielle Vorlage); die
# Rechte zum Schreiben stehen eng am Auftrag.
sonar.issue.ignore.multicriteria.scorecard.ruleKey=githubactions:S8234
sonar.issue.ignore.multicriteria.scorecard.resourceKey=.github/workflows/scorecard.yml

# os.open einer lokalen Datei im Zwischenlager blockiert nicht messbar; das
# Schreiben danach laeuft stueckweise zwischen den await des Uploads.
sonar.issue.ignore.multicriteria.blobopen.ruleKey=python:S7493
sonar.issue.ignore.multicriteria.blobopen.resourceKey=secure-messenger/server/blob_server.py
